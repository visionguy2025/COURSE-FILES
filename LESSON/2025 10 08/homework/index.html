<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Tapşırıq 1 -->
    <!-- 1dən 100ə qəfər tək və cütləri yazdıran döngü (random) -->
    <script>
        window.addEventListener('keypress', (event) => {
            if(event.key == 'o') {
                const firstNumber = Number(prompt('Enter first number: '))
                const lastNumber = Number(prompt('Enter last number: '))
    
                for(var i=firstNumber; i<=lastNumber; i++) {
                    i%2!=0 ? console.log("TEK EDED: " + i) : console.log(`CUT EDED: ${i}`)
                }
            }
        })
    </script>

    <!-- Tapşırıq 2 -->
    <!-- Vurma cədvəlini yazdıran döngü (random) -->
    <script>
        window.addEventListener('keypress', (event) => {
            if(event.key == 't') {
                let templateLiteral = ``
                for(let x=1; x<=10; x++) {
                    for(let y=1; y<=10; y++) {
                        templateLiteral = `${x} * ${y} = ${x*y}`
                        console.log(templateLiteral)
                    }
                    if(x != 10) {
                        console.log('↑↓-----------------------↓↑')
                    }
                }
            }
        })
    </script>

    <!-- Tapşırıq 3 -->
    <!-- Random rəngləri elementlərin içərisində istifadə edin -->
    <div class="box" style="
        width: 200px;
        height: 200px;
        border: 2px solid #000000;
        border-radius: 20px;
        color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        font-weight: 900;
    "></div>
    <script>
        window.addEventListener('keypress', (event) => {
            if(event.key == 'c') {
                let hexColorElements = '0123456789abcdef'
                let randomColor = `#`
                for(let i=0; i<6; i++) {
                    let randomValue0to15 = Math.round(Math.random() * (hexColorElements.length-1))
                    randomColor += hexColorElements[randomValue0to15]
                }
                document.querySelector('.box').style.backgroundColor = randomColor
                document.querySelector('.box').innerHTML = randomColor
            }
        })
    </script>

    <!-- Tapşırıq 4 -->
    <div id="labrat"></div>
    <div>
        <label for="width">width:</label>
        <input type="number" id="width">
        <br>
        <label for="height">height:</label>
        <input type="number" id="height">
        <br>
        <label for="border-radius">border-radius:</label>
        <input type="number" id="border-radius">
        <br>
        <label for="background-color">background-color:</label>
        <input type="color" id="background-color">
        <br>
        <button onclick="experiement()"> CHANGE </button>
    </div>
    <script>
        function experiement() {
            document.getElementById('labrat').style.width = document.getElementById('width').value + 'px'
            document.getElementById('labrat').style.height = document.getElementById('height').value + 'px'
            document.getElementById('labrat').style.borderRadius = document.getElementById('border-radius').value + 'px'
            document.getElementById('labrat').style.backgroundColor = document.getElementById('background-color').value
        }
    </script>
</body>
</html>
