<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- JS -->
    </head>
    <body>

        <!-- START ====================== | BUTTONS | ====================== START -->
        <!-- TO TOP BUTTON -->
        <button id="toTop" onclick="scroll2top()">▲</button>

        <!-- OVERLAY -->
        <div id="commonOverlay" onclick="enableMobileNav"></div>
        <!--  END  ====================== | BUTTONS | ======================  END  -->



        <!-- START ====================== | HEADER | ====================== START -->
        <header class="header montserrat-500" id="header">
            <!-- JS -->
        </header>
        <!--  END  ====================== | HEADER | ======================  END  -->



        <!-- START ====================== | MAIN | ====================== START -->
        <main class="main monoton-regular">
            <section class="contact">
                <article class="contactSection section">
                    CONTACT
                    <div id="map"></div>
                </article>
            </section>
        </main>
        <!--  END  ====================== | MAIN | ======================  END  -->


        
        <!-- START ====================== | FOOTER | ====================== START -->
        <footer class="footer montserrat-500" id="footer">
            <!-- JS -->
        </footer>
        <!--  END  ====================== | FOOTER | ======================  END  -->



        <!-- START ====================== | SCRIPTS | ====================== START -->
        <!-- FEATURES -->
        <script src="../utils/features.js"></script>
        <script src="../utils/setPageTitle.js"></script>
        <script src="../utils/changeLanguage.js"></script>

        <!-- COMPONENTS -->
        <script src="../components/headContents.js"></script>
        <script src="../components/Header.js"></script>
        <script src="../components/Footer.js"></script>

        <!-- CUSTOM SCRIPTS OF PAGES -->
        <script>
            // STATE VALUES
            let isMobileHeaderContent = false

            // COMPONENTS
            headContents('..')
            Header('..')
            Footer('..')

            // SET DEFAULTS
            setTitle('LOGO', 'Contact')
            changeLanguage()
            switchLight()

            // MANAGE EVENTS
            window.addEventListener('scroll', () => {
                // VARIABLES
                var header = document.getElementById('header')
                var toTopBtn = document.getElementById('toTop')
                var currentYposition = window.scrollY

                // SHOW OR HIDE TOTOPBTN OVER SCROLL OFFSET
                if(currentYposition > 400) {
                    toTopBtn.style.visibility = `visible`
                    toTopBtn.style.opacity = `100%`
                    header.style.position = 'fixed'
                } else {
                    toTopBtn.style.visibility = `hidden`
                    toTopBtn.style.opacity = `0%`
                    header.style.position = 'absolute'
                }
            })
            window.addEventListener('resize', () => {
                let headerInnerHTML = Header('..')
                if(window.innerWidth > 768) {
                    if(!isMobileHeaderContent) {
                        document.querySelector('#header').innerHTML = ``
                        document.querySelector('#header').innerHTML = headerInnerHTML
                        document.querySelector('#commonOverlay').style.display = `none`
                    }
                    isMobileHeaderContent = true
                } else {
                    if(isMobileHeaderContent) {
                        document.querySelector('#header').innerHTML = ``
                        document.querySelector('#header').innerHTML = headerInnerHTML
                        document.querySelector('#commonOverlay').style.display = `none`
                    }
                    isMobileHeaderContent = false
                }
            })
        </script>

        <!-- ✅ Leaflet JS (no integrity attribute) -->
        <script>
            document.head.innerHTML += `
                <!-- ✅ Leaflet CSS (no integrity attribute) -->
                <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />

                <style>
                    /* Required for map to show */
                    #map {
                        width: 400px;
                        height: 300px;
                    }
                </style>
            `

        </script>
        <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
        <script>
            // Wait for page to load
            window.onload = function () {
            const coords = [40.4093, 49.8671]; // Baku, Azerbaijan

            const map = L.map('map').setView(coords, 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            L.marker(coords)
                .addTo(map)
                .bindPopup('Our Office Location')
                .openPopup();
            };
        </script>

        <!-- ADD ADDITIONAL CSS OF PAGE -->
        <script>
            document.head.innerHTML += `<link rel="stylesheet" href="./contact.css">`
        </script>
        <!--  END  ====================== | SCRIPTS | ======================  END  -->
        
    </body>
</html>
